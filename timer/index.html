<!DOCTYPE html>
<html lang="no">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Nedteller · Klasseskjerm</title>
    <meta name="description" content="Nedteller for klasserommet, som skive. Fra Klasseskjerm.">
    <link rel="manifest" href="/nedteller.webmanifest">
    <link rel="icon" href="/nedteller.svg" type="image/svg+xml">
    <link rel="icon" href="/nedteller-32.png" sizes="32x32" type="image/png">
    <link rel="apple-touch-icon" href="/nedteller-180.png">
    <meta name="theme-color" content="#1E242C">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Nedteller">
    <meta name="author" content="Theodor Sandaker">
    <meta name="copyright" content="© 2026 Theodor Sandaker. Alle rettigheter forbeholdt.">
    <script>
      // Skolens nettside: data-skole på <html> før siden tegnes (se src/data/skoletema.js).
      // ?skole=<id> forhåndsviser, ?skole=ingen slår av.
      try {
        var skoler = { 'torderod': 'torderod' }; // prefiks: skole-id
        var vert = location.hostname.toLowerCase().replace(/^www\./, '');
        var skole = null;
        for (var prefiks in skoler) if (!skole && vert.indexOf(prefiks) === 0) skole = skoler[prefiks];
        var onsket = new URLSearchParams(location.search).get('skole');
        if (onsket === 'ingen') skole = null;
        for (prefiks in skoler) if (skoler[prefiks] === onsket) skole = onsket;
        if (skole) document.documentElement.setAttribute('data-skole', skole);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/timer.jsx"></script>
  </body>
</html>
